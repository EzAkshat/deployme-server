name: deployme-tests

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: deployme_test
      POSTGRES_PASSWORD: deployme_test_local
      POSTGRES_DB: deployme_test
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deployme_test -d deployme_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_test_data: